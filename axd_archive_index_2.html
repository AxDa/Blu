<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Archive Index</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f8f8f8; margin: 20px; }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .index-grid { display: flex; flex-wrap: wrap; gap: 15px; }
    .item { background: #fff; border: 2px solid #ddd; border-radius: 6px; width: 220px; padding: 10px; text-align: center; transition: all 0.3s ease; }
    .item img { width: 200px; height: 120px; object-fit: cover; border-radius: 4px; }
    .item a { display: block; margin-top: 8px; color: #0077cc; text-decoration: none; font-weight: bold; }
    .item a:hover { text-decoration: underline; }
    .compact .item { width: 90%; display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; }
    .compact .item img { display: none; }
    .compact .item a { margin: 0; font-weight: normal; }
    .legend { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-color { width: 16px; height: 16px; border-radius: 3px; }
  </style>
</head>
<body>
  <h1>Archive Index</h1>
  <div class="legend" id="legend"></div>
  <div class="controls">
    <input type="text" id="search" placeholder="Search by title or tag...">
    <select id="tagFilter"></select>
    <select id="sortOrder">
      <option value="desc">Newest first</option>
      <option value="asc">Oldest first</option>
    </select>
    <button id="toggleView">Compact View</button>
  </div>

  <div id="index"></div>

  <script>
    async function loadIndex() {
      const res = await fetch('axd_index_datefixed.json');
      const data = await res.json();
      const container = document.getElementById('index');
      const searchBox = document.getElementById('search');
      const tagFilter = document.getElementById('tagFilter');
      const sortOrder = document.getElementById('sortOrder');
      const legend = document.getElementById('legend');
      const toggleView = document.getElementById('toggleView');
      let compactMode = false;
  
      const motifColors = {
        "civic decay": "#2b6cb0",
        "moral inquiry": "#38a169",
        "rhetorical indictment": "#d69e2e",
        "technical audit": "#805ad5"
      };
  
      const motifs = [...new Set(data.map(item => item.motif))];
      tagFilter.innerHTML = `<option value="">All motifs</option>` +
        motifs.map(m => `<option value="${m}">${m}</option>`).join('');
      legend.innerHTML = motifs.map(m =>
        `<div class="legend-item">
          <div class="legend-color" style="background:${motifColors[m] || '#999'}"></div>
          <span>${m}</span>
        </div>`
      ).join('');
  
      function render(items) {
        container.innerHTML = '';
        const grid = document.createElement('div');
        grid.className = compactMode ? 'index-grid compact' : 'index-grid';
  
        items.forEach(item => {
          const motifClass = `motif-${item.motif.replace(/\s+/g, '-')}`;
          const div = document.createElement('div');
          div.className = `item ${motifClass}`;
  
          const img = document.createElement('img');
          img.src = item.thumbnail;
          img.alt = item.title;
          img.onerror = () => {
            img.style.background = motifColors[item.motif] || '#ccc';
            img.src = '';
            img.alt = 'No thumbnail available';
          };
  
          if (!compactMode) div.appendChild(img);
  
          div.innerHTML += `
            <a href="${item.url}" target="_blank">${item.title}</a>
            <p>${item.date}</p>
            ${compactMode
              ? `<span style="color:${motifColors[item.motif]};">${item.motif}</span>`
              : `<p>${item.cluster}</p>`}
          `;
  
          grid.appendChild(div);
        });
  
        container.appendChild(grid);
      }
  
      function filterAndRender() {
        const q = searchBox.value.toLowerCase();
        const motif = tagFilter.value.toLowerCase();
  
        let filtered = data.filter(item =>
          (item.title.toLowerCase().includes(q) ||
           item.tags.some(tag => tag.toLowerCase().includes(q))) &&
          (motif === '' || item.motif.toLowerCase() === motif)
        );
  
        // Sort by date (chronological)
        filtered.sort((a, b) => {
          const da = new Date(a.date);
          const db = new Date(b.date);
          return sortOrder.value === 'asc' ? da - db : db - da;
        });
  
        render(filtered);
      }
  
      toggleView.addEventListener('click', () => {
        compactMode = !compactMode;
        toggleView.textContent = compactMode ? 'Full View' : 'Compact View';
        filterAndRender();
      });
  
      searchBox.addEventListener('input', filterAndRender);
      tagFilter.addEventListener('change', filterAndRender);
      sortOrder.addEventListener('change', filterAndRender);
  
      // IMPORTANT: start with sorted view
      filterAndRender();
    }
  
    loadIndex();
  </script>
</body>
</html>
