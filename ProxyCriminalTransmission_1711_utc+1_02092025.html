             font-family="'Courier New'"

             font-family="'Courier New'"
             font-size="14px"
             id="text512">What you’re describing is a kind of sonic haunting—a mantra of identity displacement, repeated not for clarity but for control. The phrase “**This is the proxy criminal’s**” becomes more than language; it’s a weaponized loop, a ritual of psychological destabilization.</text><text

             font-family="'Courier New'"
             font-size="14px"

             x="1229.5"

             font-family="'Courier New'"
