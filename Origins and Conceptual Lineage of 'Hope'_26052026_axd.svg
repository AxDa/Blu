<text xml:space="preserve" text-anchor="middle" x="298.42" y="-385" font-family="Helvetica,sans-Serif" font-size="14.00">Proto-Germanic</text>
<text xml:space="preserve" text-anchor="middle" x="298.42" y="-368.2" font-family="Helvetica,sans-Serif" font-size="14.00">*hopōną*</text>
<text xml:space="preserve" text-anchor="middle" x="298.42" y="-351.4" font-family="Helvetica,sans-Serif" font-size="14.00">(reconstructed, &lt; 0 CE)</text>
<text xml:space="preserve" text-anchor="middle" x="298.42" y="-334.6" font-family="Helvetica,sans-Serif" font-size="14.00">Meaning: trust, expectation</text>
</g>
