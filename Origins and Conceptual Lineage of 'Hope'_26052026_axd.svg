<text xml:space="preserve" text-anchor="middle" x="1118.03" y="-227.4" font-family="Helvetica,sans-Serif" font-size="14.00">Different cultures encode hope differently:</text>
<text xml:space="preserve" text-anchor="middle" x="1118.03" y="-210.6" font-family="Helvetica,sans-Serif" font-size="14.00">Greek: elpis (expectation)</text>
<text xml:space="preserve" text-anchor="middle" x="1118.03" y="-193.8" font-family="Helvetica,sans-Serif" font-size="14.00">Hebrew: tikvah (tension toward future)</text>
<text xml:space="preserve" text-anchor="middle" x="1118.03" y="-177" font-family="Helvetica,sans-Serif" font-size="14.00">Sanskrit: āśā (aspiration)</text>
<text xml:space="preserve" text-anchor="middle" x="1118.03" y="-160.2" font-family="Helvetica,sans-Serif" font-size="14.00">Germanic: hopian (trust/confidence)</text>
</g>
