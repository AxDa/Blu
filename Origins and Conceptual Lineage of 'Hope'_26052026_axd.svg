<text xml:space="preserve" text-anchor="middle" x="542.49" y="-330.2" font-family="Helvetica,sans-Serif" font-size="14.00">hopian (c. 900 CE)</text>
<text xml:space="preserve" text-anchor="middle" x="542.49" y="-313.4" font-family="Helvetica,sans-Serif" font-size="14.00">Meaning: to trust, expect,</text>
<text xml:space="preserve" text-anchor="middle" x="542.49" y="-296.6" font-family="Helvetica,sans-Serif" font-size="14.00">look forward with confidence</text>
</g>
