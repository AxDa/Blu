  <script>
    document.getElementById("graph").addEventListener("load", function () {
      const svgDoc = this.contentDocument;

      const setupNode = (nodeId, audioId, iconX, iconY) => {
        const node = svgDoc.getElementById(nodeId);
        if (node) {
          node.style.cursor = "pointer";

          // Add speaker icon
          const speaker = svgDoc.createElementNS("http://www.w3.org/2000/svg", "text");
          speaker.setAttribute("x", iconX); // Adjust as needed
          speaker.setAttribute("y", iconY);
          speaker.setAttribute("fill", "#FFD700");
          speaker.setAttribute("font-size", "16");
          speaker.textContent = "🔊 play";// speaker.textContent = "🔊";
          node.appendChild(speaker);

          // Click to play audio
          node.addEventListener("click", function () {
            const audio = document.getElementById(audioId);
            audio.style.display = "block";
            audio.scrollIntoView({ behavior: "smooth" });
            audio.play();
          });
        }
      };

      setupNode("node3", "audioPlayer3", "1544.05", "-803.336");
      setupNode("node3", "audioPlayer3a", "1210.05", "-803.336");
      setupNode("node4", "audioPlayer4", "1565.74", "-606.31702");
      setupNode("node17", "audioPlayer17", "1277.17", "-1183.0699");
      setupNode("node8", "audioPlayer8", "1738.78", "-1411.4399");
      setupNode("node10", "audioPlayer10", "516.737", "-592.59601");
      setupNode("node9", "audioPlayer9", "8146.263", "-329.80801");
      setupNode("node22", "audioPlayer22", "2180.6599", "-14.3");
      setupNode("node16", "audioPlayer16", "856.263", "-1276.86");
    });
