name: Deploy GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove heavy folders ONLY (safe)
        run: |
          # rm -rf big_json
          # rm -rf cache
          # rm -rf output_audio
          # rm -rf thumbnails

          # DO NOT DELETE ANY ROOT FILES
          # DO NOT DELETE ANY HTML
          # DO NOT DELETE ANY JSON
          # DO NOT DELETE ANY PNG
          # DO NOT DELETE ANY SVG
          # DO NOT DELETE ANYTHING your JSON references

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
