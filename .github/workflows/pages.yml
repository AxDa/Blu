name: Deploy GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4   # ← FIXED

      - name: Build
        run: |
          echo "No build step"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Blu

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
