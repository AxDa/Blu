name: Deploy GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exclude heavy files and folders from artifact
        run: |
          # Heavy folders
          rm -rf big_json
          rm -rf cache
          rm -rf output_audio
          rm -rf thumbnails

          # Heavy HTML files in repo root
          rm -f Semantic_freq_extraction_dotfilesrawoutput_13092025_axd\(wip\).html
          rm -f WorldTimeZonesNodeDripEcho_1908_27082025.html
          rm -f InterrogationGlyphsHumanity_graph_1812_utc_10112025_axd.html
          rm -f opening_index.html
          rm -f index.html
          rm -f ButtonholeSanctum_RoyalHousesAmericanGlobalDynastiesIndictmentLatticefromSaxa-CoburgandGothaEst1917_1019_30102025_axd.html
          rm -f full_svg.html

          # Heavy JSON (but stays in repo)
          rm -f axd_index_datefixed_rawurls.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
